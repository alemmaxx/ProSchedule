:root{color-scheme:light;
  --ground:#FFF3C9;--ground-2:#FFE9A3;--paper:#FFFFFF;--ink:#1F2A44;--ink-soft:#56607A;--line:#E7D9A6;
  --bm:#E0463B;--mt:#2C74E0;--en:#EE8420;--sn:#23A047;--pu:#7B4FD0;--star:#FFB800;--accent:var(--mt);
  --display:"Fredoka","Baloo 2","Comic Sans MS",system-ui,sans-serif;
  --read:"Andika","Trebuchet MS",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--ground);color:var(--ink);font-family:var(--read);font-size:17px;line-height:1.45;background-image:radial-gradient(circle at 1px 1px,rgba(31,42,68,.07) 1.5px,transparent 0);background-size:22px 22px;min-height:100vh}
h1,h2,h3,.disp{font-family:var(--display);font-weight:700;margin:0;letter-spacing:.2px}
.hide{display:none!important}
.wrap{max-width:640px;margin:0 auto;padding:14px max(14px,env(safe-area-inset-left)) 40px}
/* top bar */
.bar{display:flex;align-items:center;gap:10px;padding:12px max(14px,env(safe-area-inset-left)) 4px;max-width:640px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.logo{width:42px;height:42px;flex:none}
.brand h1{font-size:21px;line-height:1}
.brand small{display:block;font-family:var(--display);font-weight:500;color:var(--ink-soft);font-size:12px;margin-top:2px}
.r{display:flex;gap:8px}
/* buttons (ProKuiZ style: thick ink border + offset shadow) */
button{font-family:var(--display);font-weight:700;font-size:17px;color:#fff;cursor:pointer;border:3px solid var(--ink);border-radius:16px;padding:10px 18px;background:var(--accent);box-shadow:0 4px 0 var(--ink)}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
button.ghost{background:var(--paper);color:var(--ink)}
button.icon{background:var(--paper);color:var(--ink);border-width:2px;border-radius:14px;padding:7px 12px;font-size:15px;font-weight:600;box-shadow:0 3px 0 var(--ink)}
button.icon:active{box-shadow:0 1px 0 var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
/* cards */
.card{background:var(--paper);border:3px solid var(--ink);border-radius:24px;padding:14px;margin-bottom:16px;box-shadow:0 6px 0 var(--ink)}
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.nav b{font-family:var(--display);font-size:22px}
.nav button{padding:4px 14px;font-size:20px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.dow{font-family:var(--display);font-weight:600;font-size:13px;color:var(--ink-soft)}
.day{aspect-ratio:1;border-radius:12px;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--display);font-weight:600;font-size:17px;position:relative}
.day.today{border-color:var(--ink);background:var(--ground)}
.day.sel{background:var(--accent);color:#fff;border-color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--bm);position:absolute;bottom:4px}
.day.sel .dot{background:var(--star)}
.empty{color:var(--ink-soft);font-size:15px;padding:8px 0}
#hint{font-family:var(--display);font-weight:500}
/* day page */
#dayTitle{font-family:var(--display);font-size:22px;display:block;margin-bottom:6px}
.hour{display:flex;gap:10px;border-top:2px dashed var(--line);padding:8px 0;min-height:46px}
.hour .t{width:50px;font-family:var(--display);font-weight:600;color:var(--ink-soft);font-size:14px;padding-top:4px}
.hour .c{flex:1;min-width:0}
.hour .add{color:#C9B97A;font-family:var(--display);font-weight:600;font-size:14px;padding-top:4px}
.ev{border:2px solid var(--ink);border-left:8px solid;border-radius:14px;padding:6px 8px 6px 10px;margin-bottom:6px;background:#FFFDF6;font-size:15px;display:flex;justify-content:space-between;gap:8px;box-shadow:0 3px 0 var(--ink)}
.ev b{font-family:var(--display);font-weight:700;font-size:17px}
.ev small{color:var(--ink-soft);display:block;font-size:13px}
.ev .x{background:none;color:var(--bm);border:0;box-shadow:none;padding:0 8px;font-size:24px;line-height:1}
.ev .x:active{transform:none}
/* modals */
.modal{position:fixed;inset:0;background:rgba(31,42,68,.55);display:none;align-items:flex-end;z-index:9}
.modal.on{display:flex}
.modal.mid{align-items:center;justify-content:center;padding:24px}
.sheet{background:var(--ground);width:100%;max-width:640px;margin:0 auto;border:3px solid var(--ink);border-bottom:0;border-radius:24px 24px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
.modal.mid .sheet{border:3px solid var(--ink);border-radius:24px;max-width:340px;background:var(--paper);box-shadow:0 6px 0 var(--ink)}
.sheet h2{font-size:23px;margin:0 0 8px}
label{display:block;font-family:var(--display);font-weight:600;font-size:15px;color:var(--ink);margin:12px 0 5px}
input,select,textarea{width:100%;font-family:var(--read);font-size:17px;padding:10px 12px;border:2px solid var(--ink);border-radius:14px;background:#fff;color:var(--ink)}
.row{display:flex;gap:10px;margin-top:16px}
.row button{flex:1}
.dg{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:2px dashed var(--line);font-size:16px}
.dg button{padding:6px 12px;font-size:14px;box-shadow:0 3px 0 var(--ink)}
.types{display:flex;flex-wrap:wrap;gap:8px}
.types span{font-family:var(--display);font-weight:600;padding:7px 14px;border-radius:999px;border:2px solid var(--ink);background:var(--paper);font-size:15px}
.types span.on{color:#fff;box-shadow:0 3px 0 var(--ink)}
.sep{border-top:3px dashed var(--line);margin:18px 0 4px}
@media(max-width:430px){.brand small{display:none}.brand h1{font-size:19px}.logo{width:38px;height:38px}}


button.sm{padding:6px 12px;font-size:14px;box-shadow:0 3px 0 var(--ink);border-radius:12px}
button.tog{background:var(--paper);color:var(--ink-soft);padding:6px 14px;font-size:14px;border-radius:999px;box-shadow:0 3px 0 var(--ink)}
button.tog.on{background:var(--sn);color:#fff}
.pill{display:inline-block;font-family:var(--display);font-weight:600;font-size:12px;background:#FFF1BF;border:2px solid var(--ink);border-radius:999px;padding:0 9px;margin-left:6px;vertical-align:middle}
.alrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:2px dashed var(--line)}
.alrow b{font-family:var(--display);font-size:24px}
.alrow small{display:block;color:var(--ink-soft);font-size:13px}
.acts{display:flex;gap:8px;align-items:center}
.sndrow{display:flex;gap:8px;align-items:center}
.sndrow select{flex:1;min-width:0}
.sndrow button{flex:none}
.box{background:var(--paper);border:2px solid var(--ink);border-radius:18px;padding:12px;margin-top:14px}
.box.off .flds{opacity:.45;pointer-events:none}
.box .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.box .top b{font-family:var(--display);font-size:17px}
.hint{font-size:13px;color:var(--ink-soft);margin:8px 0 0}
.ringbox{text-align:center}
.ringbox .bell{font-size:64px;line-height:1}
body.sub .logo{display:none}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.toprow b{font-family:var(--display);font-size:17px}
.rowsel{font-size:14px;padding:6px 8px;margin-top:6px;border-radius:10px;max-width:210px}

  if(BUILTIN.some(b => b.id === id)) return id + '.wav';
  if(/^c_/.test(id)) return id + '.mp3';
  return null;
}

  return [{id:'default', n:T('sndDefault')}]
    .concat(BUILTIN.map(b => ({id:b.id, n:b[lang]})))

    .concat(userSounds.map(s => ({id:s.id, n:'📱 '+s.name+' '+T('appOnly')})));
}

function fillSound(sel, val){
  const list = allSounds();
  sel.innerHTML = list.map(s => `<option value="${esc(s.id)}">${esc(s.n)}</option>`).join('');
  sel.value = list.some(s => s.id === val) ? val : 'default';
}
let audio = null;
const AP = (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform() && window.Capacitor.registerPlugin) ? window.Capacitor.registerPlugin('AlarmPlayer') : null;
const storedNative = new Set();
const toB64 = blob => new Promise((res,rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = () => rej(r.error); r.readAsDataURL(blob); });
function stopAudio(){
  if(audio){ try{ audio.pause(); }catch(e){} audio = null; }
  if(AP){ try{ AP.stop().catch(() => {}); }catch(e){} }
}
async function playSound(id, loop){
  stopAudio();
  const u = userSounds.find(s => s.id === id);
  if(AP){
    try{
      if(u){
        if(!storedNative.has(id)){ await AP.store({id, data: await toB64(u.blob)}); storedNative.add(id); }
        await AP.play({id, loop: !!loop}); return;
      }
      if(soundFile(id)){ await AP.playRaw({name:id, loop: !!loop}); return; }
    }catch(e){ console.log('native play failed', e); }
  }
  let url = null;
  if(u) url = URL.createObjectURL(u.blob);
  else { const f = soundFile(id); if(f) url = 'sounds/' + f; }
  if(!url) return;
  audio = new Audio(url); audio.loop = !!loop;
  audio.play().catch(() => {});
}

/* IndexedDB for user-added mp3 */
function idb(){ return new Promise((res,rej) => { const r = indexedDB.open('ps_db',1); r.onupgradeneeded = () => r.result.createObjectStore('snd',{keyPath:'id'}); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbAll(){ const db = await idb(); return new Promise((res,rej) => { const q = db.transaction('snd').objectStore('snd').getAll(); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
async function idbPut(o){ const db = await idb(); return new Promise((res,rej) => { const t = db.transaction('snd','readwrite'); t.objectStore('snd').put(o); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); }
async function idbDel(id){ const db = await idb(); return new Promise((res,rej) => { const t = db.transaction('snd','readwrite'); t.objectStore('snd').delete(id); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); }

/* ---------- Google Calendar (melalui akaun Google dalam telefon) ---------- */
function detectCal(){
  try{
    const C = window.Capacitor;
    if(!C) return null;
    const native = (C.isNativePlatform && C.isNativePlatform()) || (C.getPlatform && C.getPlatform() === 'android');
    if(!native) return null;
    return (C.Plugins && C.Plugins.CalendarSync) || (C.registerPlugin ? C.registerPlugin('CalendarSync') : null);
  }catch(e){ return null; }
}
let CAL = detectCal();
const calWhy = () => { const C = window.Capacitor; return C ? ' [platform: ' + (C.getPlatform ? C.getPlatform() : '?') + ']' : ' [tiada Capacitor - buka melalui APK, bukan browser/PWA]'; };

let calMap = J('ps_calmap', {});
let imp = J('ps_imp', {on:false, ids:[]});
let gEvents = J('ps_gevents', []);
let gHide = J('ps_ghide', []);

/* hantar jadual ProSchedule -> Google Calendar (tanpa alarm) */
async function calUpsert(e){
  if(!CAL || !cal.on || !cal.calId) return;
  try{
    const start = new Date(`${e.date}T${e.time}:00`).getTime();
    const r = await CAL.upsert({calId: cal.calId, eventId: calMap[e.id] || -1, title: e.title,
      desc: `${tname(e)}${e.note ? '\n' + e.note : ''}\n(ProSchedule)`, start, end: start + 3600000});
    calMap[e.id] = r.eventId; saveCal();
  }catch(err){ console.log('cal upsert', err); }
}
async function calRemove(id){
  if(!CAL || !calMap[id]) return;
  try{ await CAL.remove({eventId: calMap[id]}); }catch(err){}
  delete calMap[id]; saveCal();
}
async function calSyncAll(){ for(const e of events) if(!calMap[e.id]) await calUpsert(e); }
async function calClearAll(){ for(const id of Object.keys(calMap)) await calRemove(id); }
function delEvent(idv){
  if(String(idv).startsWith('g')){ if(!gHide.includes(idv)) gHide.push(idv); }
  else { const n = +idv; events = events.filter(e => e.id !== n); calRemove(n); }
  save(); renderCal(); renderDay(); renderDayPopup();
}

/* tarik jadual Google Calendar -> ProSchedule */
async function importSync(){
  if(!CAL || !imp.on || !imp.ids.length) return;
  try{
    const s = new Date(); s.setDate(s.getDate()-30); s.setHours(0,0,0,0);
    const e2 = new Date(); e2.setMonth(e2.getMonth()+6);
    const r = await CAL.listEvents({calIds: imp.ids, start: s.getTime(), end: e2.getTime()});
    const mine = new Set(Object.values(calMap).map(String));
    const out = [];
    (r.events || []).forEach(x => {
      if(mine.has(String(x.eventId)) || String(x.desc || '').indexOf('(ProSchedule)') >= 0) return;
      const title = x.title || '(-)';
      if(x.allDay){
        for(let t = x.begin, k = 0; t < x.end && k < 14; t += 86400000, k++){
          const ds = new Date(t).toISOString().slice(0,10);
          out.push({id:`g${x.eventId}_${ds}`, src:'g', date:ds, time:'00:00', allDay:true, title, rem:0});
        }
      } else {
        const d = new Date(x.begin);
        out.push({id:`g${x.eventId}_${x.begin}`, src:'g', date:fmt(d), time:`${pad(d.getHours())}:${pad(d.getMinutes())}`, allDay:false, title, rem:10});
      }
    });
    const next = out.slice(0, 800);
    if(JSON.stringify(next) !== JSON.stringify(gEvents)){
      gEvents = next; save(); renderCal(); renderDay(); renderDayPopup();
    }
  }catch(err){ console.log('import', err); }
}
let impTimer = null;
const impSoon = () => { clearTimeout(impTimer); impTimer = setTimeout(() => importSync(), 3000); };

/* akaun & kalendar */
async function loadCals(){
  const r = await CAL.listCalendars({all:true, account: gacc ? gacc.name : ''});
  impCals = r.calendars || [];
  if(!impCals.length) return false;
  const writable = impCals.filter(c => c.canWrite);
  const pri = writable.find(c => c.name === c.account) || writable[0] || impCals[0];
  if(!impCals.some(c => c.id === cal.calId)) cal.calId = pri.id;
  imp.ids = imp.ids.filter(id => impCals.some(c => c.id === id));
  if(!imp.ids.length) imp.ids = [pri.id];
  saveCal(); renderG();
  return true;
}
function renderG(){
  $('gAccName').textContent = gacc ? gacc.name : T('gNone');
  $('gFlds').classList.toggle('hide', !gacc);
  $('autoOn').textContent = autoSync ? 'ON' : 'OFF';
  $('autoOn').classList.toggle('on', autoSync);
  $('calSel').innerHTML = impCals.filter(c => c.canWrite).map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
  if(cal.calId) $('calSel').value = cal.calId;
  $('impList').innerHTML = impCals.map(c => { const on = imp.ids.includes(c.id); return `<span data-c="${c.id}" class="${on?'on':''}" style="${on?'background:#4285F4':''}">${esc(c.name)}</span>`; }).join('');
  document.querySelectorAll('#impList span').forEach(s => s.onclick = () => {
    const id = +s.dataset.c;
    imp.ids = imp.ids.includes(id) ? imp.ids.filter(x => x !== id) : imp.ids.concat(id);
    save(); renderG(); importSync();

  $('gLast').textContent = lastSync ? `${T('gLast')} ${new Date(lastSync).toLocaleString()}` : '';
}

async function syncGoogle(manual){
  CAL = CAL || detectCal();
  if(!CAL || !gacc) { if(manual) gmsg(CAL ? T('gNone') : T('calNA') + calWhy()); return; }
  try{
    const g = await CAL.requestAccess();
    if(!g.granted){ if(manual) gmsg(T('calDenied')); return; }
    if(manual) gmsg(T('gSyncing'));
    try{ await CAL.refresh(); }catch(e){}
    if(!(await loadCals())){ if(manual) gmsg(T('calNone')); return; }
    cal.on = true; imp.on = true; saveCal();
    await calSyncAll();
    await importSync();
    lastSync = Date.now(); localStorage.setItem('ps_lastsync', lastSync);
    save(); renderG();
    if(manual) gmsg(T('gDone').replace('{n}', gEvents.length));
  }catch(e){ if(manual) gmsg(String(e)); }
}
$('gSync').onclick = () => syncGoogle(true);

/* ---------- calendar & day page ---------- */
function dateTitle(ds){
  const [y,m,d] = ds.split('-').map(Number);
  return `${T('dow')[new Date(y,m-1,d).getDay()]}, ${d} ${T('months')[m-1]} ${y}`;
}
function remLabel(r){ return r>=1440 ? T('day1') : r>=60 ? T('hr1') : r+' '+T('min'); }

function renderCal(){
  $('mon').textContent = `${T('months')[view.getMonth()]} ${view.getFullYear()}`;
  $('dows').innerHTML = T('dow').map(d => `<div class="dow">${d}</div>`).join('');
  const first = view.getDay(), days = new Date(view.getFullYear(), view.getMonth()+1, 0).getDate();
  const today = fmt(new Date());
  let h = '';
  for(let i=0;i<first;i++) h += '<div></div>';
  for(let d=1; d<=days; d++){
    const ds = `${view.getFullYear()}-${pad(view.getMonth()+1)}-${pad(d)}`;
    const has = allEvents().some(e => e.date === ds);
    h += `<div class="day ${ds===today?'today':''} ${ds===selected?'sel':''}" data-d="${ds}">${d}${has?'<i class="dot"></i>':''}</div>`;
  }
  $('cal').innerHTML = h;
  document.querySelectorAll('.day').forEach(el => el.onclick = () => { selected = el.dataset.d; renderCal(); renderDay(); openDay(); });
}

function renderDay(){
  $('dayTitle').textContent = dateTitle(selected);
  let h = '';
  for(let hr=0; hr<24; hr++){
    const evs = allEvents().filter(e => e.date===selected && +e.time.slice(0,2)===hr).sort((a,b)=>a.time.localeCompare(b.time));
    h += `<div class="hour" data-h="${hr}"><div class="t">${pad(hr)}:00</div><div class="c">` +
      evs.map(e => `<div class="ev" style="border-left-color:${tcol(e)}"><div><b>${esc(tlabel(e))} ${esc(e.title)}</b><small>${esc(tname(e))}${e.rem>0?' • '+T('before')+' '+remLabel(e.rem)+' '+T('early'):''}${e.note?' • '+esc(e.note):''}</small></div><button class="x" data-del="${e.id}">×</button></div>`).join('') +
      (evs.length ? '' : `<div class="add">${T('add')}</div>`) + `</div></div>`;
  }
  $('hours').innerHTML = h;
  document.querySelectorAll('.hour').forEach(el => el.onclick = ev => {
    if(ev.target.dataset.del) return;
    openEv(+el.dataset.h);
  });
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = ev => {
    ev.stopPropagation();
    if(confirm(T('confirmDel'))) delEvent(b.dataset.del);
  });
}

function renderTypes(){
  $('evTypes').innerHTML = Object.keys(TYPES).map(t => `<span data-t="${t}" class="${t===evType?'on':''}" style="${t===evType?'background:'+TYPES[t]:''}">${T('types')[t]}</span>`).join('');
  document.querySelectorAll('#evTypes span').forEach(s => s.onclick = () => { evType = s.dataset.t; renderTypes(); });

/* ---------- alarm list ---------- */
function renderAlarms(){
  const list = alarms.slice().sort((a,b) => a.t.localeCompare(b.t));
  $('alList').innerHTML = list.length ? list.map(a =>
    `<div class="alrow"><div><b>${esc(a.t)}</b><span class="pill">${a.rep==='daily'?T('daily'):T('once')}</span><small>${+a.t.slice(0,2)>=12?T('lblEsok'):T('lblIni')}</small><select class="rowsel" data-sd="${a.id}"></select></div>
     <div class="acts"><button class="tog ${a.on?'on':''}" data-tg="${a.id}">${a.on?'ON':'OFF'}</button><button class="ghost sm" data-rm="${a.id}">×</button></div></div>`).join('')
    : `<div class="empty">${T('noAlarm')}</div>`;
  document.querySelectorAll('[data-sd]').forEach(s => {
    const a0 = alarms.find(x => x.id === +s.dataset.sd);
    fillSound(s, a0 ? a0.sound : 'default');
    s.onchange = () => { const a1 = alarms.find(x => x.id === +s.dataset.sd); if(a1){ a1.sound = s.value; save(); } };

  document.querySelectorAll('[data-tg]').forEach(b => b.onclick = () => { const a = alarms.find(x => x.id === +b.dataset.tg); a.on = !a.on; save(); renderAlarms(); });
  document.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { alarms = alarms.filter(x => x.id !== +b.dataset.rm); save(); renderAlarms(); });

  const open = MODALS.find(id => $(id).classList.contains('on'));
  if(open){ if(open !== 'mExit') stopAudio(); $(open).classList.remove('on'); return; }
  if(page === 'day'){ showPage('cal'); return; }
  $('mExit').classList.add('on');
}
if(APP && APP.addListener) APP.addListener('backButton', goBack);
$('btnBack').onclick = goBack;
$('exNo').onclick = () => $('mExit').classList.remove('on');
$('exYes').onclick = () => { if(APP && APP.exitApp) APP.exitApp(); else window.close(); };
$('ringStop').onclick = () => { stopAudio(); $('mRing').classList.remove('on'); };

/* ---------- notifications ---------- */
function ring(n){
  const snd = n && n.extra && n.extra.sound;
  if(!snd || !userSounds.some(s => s.id === snd)) return;
  $('ringT').textContent = n.title || ''; $('ringB').textContent = n.body || '';
  playSound(snd, true); $('mRing').classList.add('on');
}
if(LN && LN.addListener){
  LN.addListener('localNotificationActionPerformed', e => ring(e.notification));
  LN.addListener('localNotificationReceived', n => ring(n));
}
const chanOf = id => soundFile(id) ? 'ps3_'+id : 'ps3_default';
const mk = (o, snd) => Object.assign({}, o, {channelId: chanOf(snd), extra:{sound: snd || 'default'}}, soundFile(snd) ? {sound: soundFile(snd)} : {});

async function ensureChannels(){
  const ids = ['default'].concat(BUILTIN.map(b => b.id), repoSounds.map(s => s.id));
  for(const id of ids){
    const ch = {id:'ps3_'+id, name:'ProSchedule - '+soundName(id), importance:5, visibility:1, vibration:true};
    const f = soundFile(id); if(f) ch.sound = f;
    try{ await LN.createChannel(ch); }catch(e){}
  }
}
function sumFor(ds){
  const evs = allEvents().filter(e => e.date===ds).sort((a,b)=>a.time.localeCompare(b.time));
  return {
    body: evs.length ? evs.map(e => `${tlabel(e)} ${e.title}`).join(' | ') : T('noSched'),
    large: evs.length ? evs.map(e => `${tlabel(e)}  ${e.title} (${tname(e)})`).join('\n') : T('noSched')
  };
}

async function resched(){
  if(!LN) return;
  try{
    const perm = await LN.requestPermissions();
    if(perm.display !== 'granted') return;
    await ensureChannels();
    const p = await LN.getPending();
    const old = p.notifications.filter(n => n.id !== TEST_ID).map(n => ({id:n.id}));
    if(old.length) await LN.cancel({notifications: old});
    const list = [], now = new Date();

    events.forEach(e => {
      const d = new Date(`${e.date}T${e.time}:00`);
      const tn = tname(e);
      if(d > now) list.push(mk({id:e.id*2, title:`${tn}: ${e.title}`, body:`${T('nowTxt')} • ${e.time}`, schedule:{at:d, allowWhileIdle:true}}, evSound));
      if(e.rem > 0){
        const r = new Date(d.getTime() - e.rem*60000);
        if(r > now) list.push(mk({id:e.id*2+1, title:`${T('soon')}: ${e.title}`, body:`${tn} ${T('at')} ${e.time}`, schedule:{at:r, allowWhileIdle:true}}, evSound));
      }
    });

    const nowMs = now.getTime(), lim = nowMs + 30*86400000;
    allEvents().filter(e => e.src === 'g' && !e.allDay).slice(0, 100).forEach((e, gi) => {
      const d = new Date(`${e.date}T${e.time}:00`);
      if(d.getTime() > nowMs && d.getTime() < lim) list.push(mk({id:4000000+gi*2, title:`Google: ${e.title}`, body:`${T('nowTxt')} • ${e.time}`, schedule:{at:d, allowWhileIdle:true}}, evSound));
      const r = new Date(d.getTime() - 600000);
      if(r.getTime() > nowMs && d.getTime() < lim) list.push(mk({id:4000001+gi*2, title:`${T('soon')}: ${e.title}`, body:`Google ${T('at')} ${e.time}`, schedule:{at:r, allowWhileIdle:true}}, evSound));
    });

    alarms.forEach((a,i) => {
      if(!a.on) return;
      const [hh,mm] = a.t.split(':').map(Number);
      const off = hh >= 12 ? 1 : 0;
      const times = a.rep === 'once' ? [new Date(a.at)] : Array.from({length:14}, (_,o) => { const d = new Date(); d.setDate(d.getDate()+o); d.setHours(hh,mm,0,0); return d; });
      times.forEach((at,o) => {
        if(at <= now) return;
        const tg = new Date(at); tg.setDate(tg.getDate()+off);
        const ds = fmt(tg), s = sumFor(ds);
        list.push(mk({id:2000000+o*100+i, title:`${off ? T('nTomorrow') : T('nToday')} (${ds})`, body:s.body, largeBody:s.large, schedule:{at, allowWhileIdle:true}}, a.sound));
      });
    });

    Object.keys(dayAlarms).forEach(ds => {
      const a = dayAlarms[ds]; if(!a || !a.on) return;
      const [hh,mm] = a.t.split(':').map(Number);
      const base = new Date(ds+'T00:00:00');
      const at = new Date(base); if(hh >= 22) at.setDate(at.getDate()-1); at.setHours(hh,mm,0,0);
      if(at <= now) return;
      const s = sumFor(ds);
      list.push(mk({id:3000000+Math.floor(base.getTime()/86400000), title:`${T('nDay')} (${ds})`, body:s.body, largeBody:s.large, schedule:{at, allowWhileIdle:true}}, a.sound));
    });

    if(list.length) await LN.schedule({notifications:list});
  }catch(err){ console.log('resched error', err); }
}

/* ---------- language & init ---------- */
function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i]').forEach(el => el.textContent = T(el.dataset.i));
  $('evTitle').placeholder = T('titlePh');
  $('hint').textContent = T('hint');
  const rv = $('evRem').value || '10';
  $('evRem').innerHTML = [0,10,30,60,1440].map(v => `<option value="${v}">${T('r'+v)}</option>`).join('');
  $('evRem').value = rv;
  const rp = $('alRep').value || 'daily';
  $('alRep').innerHTML = `<option value="once">${T('once')}</option><option value="daily">${T('daily')}</option>`;
  $('alRep').value = rp;
  $('dpTime').innerHTML = DAYTIMES.map(t => `<option value="${t}">${t}</option>`).join('');
  renderCal(); renderDay(); renderTypes(); renderAlarms(); renderCfg(); renderDayPopup();
  fillSound($('alSound'), $('alSound').value); fillSound($('tsSound'), $('tsSound').value); fillSound($('evSndSel'), evSound);
}
async function init(){
  try{ userSounds = await idbAll(); }catch(e){}
  try{ const r = await fetch('sounds.json'); const a = await r.json(); repoSounds = a.map(n => ({id:'c_'+n, n})); }catch(e){}
  applyLang(); save();
  if(CAL && imp.on){ try{ CAL.refresh().catch(() => {}); }catch(e){} importSync(); }
  if(CAL && CAL.addListener){ try{ CAL.addListener('calendarChanged', impSoon); }catch(e){} }
  autoTick(); setInterval(autoTick, 300000);
  if(APP && APP.addListener){ APP.addListener('resume', () => { autoTick(); if(CAL && $('mCfg').classList.contains('on') && gacc) loadCals().catch(() => {}); if(CAL && imp.on){ try{ CAL.refresh().catch(() => {}); }catch(e){} importSync(); impSoon(); } }); }
}
init();
