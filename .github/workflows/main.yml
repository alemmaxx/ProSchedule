name: Build ProSchedule APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: Channel notifikasi guna volume alarm
        run: cp android-native/*.java android/app/src/main/java/com/proschedule/app/
      - name: Tambah permission notifikasi
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n    <application#' android/app/src/main/AndroidManifest.xml
      - name: Bundle alarm sounds
        run: |
          RAW=android/app/src/main/res/raw
          mkdir -p "$RAW"
          cp www/sounds/*.wav "$RAW"/
          shopt -s nullglob
          names=""
          for f in custom-sounds/*.mp3; do
            n=$(basename "$f" .mp3 | tr 'A-Z' 'a-z' | sed 's/[^a-z0-9_]/_/g')
            cp "$f" "$RAW/c_$n.mp3"
            cp "$f" "www/sounds/c_$n.mp3"
            names="$names\"$n\","
          done
          echo "[${names%,}]" > www/sounds.json
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ProSchedule-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
 
